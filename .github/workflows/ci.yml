name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # PR 只做快速编译检查，不产出构建
      - name: Cargo check
        if: github.event_name == 'pull_request'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 免安装：直接 cargo build 产出单个便携 exe（无 NSIS 安装包、无 Node 依赖）
      - name: Build portable exe
        if: github.event_name != 'pull_request'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # 真实 Windows + WebView2 运行时验证：窗口创建 / 外部页面加载 / 退出能否退干净
      - name: Selftest on real Windows
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/CloudPhoneKeep.exe"
          Write-Host "运行 $exe --selftest ..."
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(100000)) {
            Write-Host "::error::selftest 超时未退出（退出卡死）"
            Stop-Process -Id $p.Id -Force
            Get-Content "src-tauri/target/release/logs/selftest.log" -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }
          Write-Host "SELFTEST 退出码: $($p.ExitCode)"
          $logDir = "src-tauri/target/release/logs"
          if (Test-Path "$logDir/selftest.log") {
            Write-Host "----- selftest.log -----"
            Get-Content "$logDir/selftest.log" | Write-Host
          }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload exe to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          body: |
            自动构建 (dev, 便携版)
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            时间: ${{ github.run_started_at }} UTC

            单文件免安装：exe 放到任意目录运行，配置/数据/日志都生成在 exe 所在目录。
          files: |
            src-tauri/target/release/CloudPhoneKeep.exe
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
