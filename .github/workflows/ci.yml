name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # =====================================================================
  # Windows 便携版（原有流程，保持不变）
  # =====================================================================
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # PR 只做快速编译检查，不产出构建
      - name: Cargo check
        if: github.event_name == 'pull_request'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 免安装：直接 cargo build 产出单个便携 exe（无 NSIS 安装包、无 Node 依赖）
      - name: Build portable exe
        if: github.event_name != 'pull_request'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload exe to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          body: |
            自动构建 (dev, 便携版)
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            时间: ${{ github.run_started_at }} UTC

            单文件免安装：exe 放到任意目录运行，配置/数据/日志都在 AppData\LocalLow\CloudPhoneKeep。
          files: |
            src-tauri/target/release/CloudPhoneKeep.exe
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # Linux + Docker 版（linux/ + shared/）：Rust musl 引擎 + Alpine Chromium + CDP
  # 一容器一账号；全部编译在 CI 完成（本地无需 Rust 工具链）
  # 镜像多架构（linux/amd64 + linux/arm64）：Rust 交叉编译走 rust-lld
  # 原生速度，QEMU 仅用于 arm64 运行层的 apk 安装
  # =====================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: linux

      # —— 无浏览器环境下的快速回归：单元测试 + selftest ——
      - name: Unit tests
        working-directory: linux
        run: cargo test

      - name: Selftest (no browser)
        working-directory: linux
        run: |
          cargo build --release
          CPK_SELFTEST=1 CPK_DATA_DIR=${RUNNER_TEMP}/cpk-selftest ./target/release/cloudphonekeep

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 多阶段构建（context=仓库根，Dockerfile 引用 linux/ 与 shared/）：
      # Rust 编译在容器内完成（cargo 缓存挂载走 GHA cache）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: linux/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cpk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # —— 冒烟：跑真实 Chromium（镜像内置 Alpine chromium + Rust 引擎），
      #    验证 WS 握手/CDP 注入/看门狗/回环服务全链路，跑 N 秒按指标退出 ——
      - name: Smoke test image
        run: |
          docker run --rm \
            -e CPK_SMOKE=1 \
            -e CPK_SMOKE_SECONDS=60 \
            -e CPK_URL=https://example.com \
            cpk:ci

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多架构推送（amd64 + arm64 单一 manifest 列表）：
      # arm64 层与 amd64 共享 GHA 层缓存，Rust 交叉编译原生速度
      - name: Push multi-arch image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: linux/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:latest
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
