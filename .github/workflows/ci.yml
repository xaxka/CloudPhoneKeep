name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # =====================================================================
  # Windows 便携版（原有流程，保持不变）
  # src-tauri 为独立 Cargo workspace（见其 Cargo.toml 的 [workspace] 标记），
  # target/ 仍在 src-tauri/ 下，缓存与产物路径与重构前完全一致。
  # =====================================================================
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # PR 只做快速编译检查，不产出构建
      - name: Cargo check
        if: github.event_name == 'pull_request'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 免安装：直接 cargo build 产出单个便携 exe（无 NSIS 安装包、无 Node 依赖）
      - name: Build portable exe
        if: github.event_name != 'pull_request'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload exe to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          body: |
            自动构建 (dev, 便携版)
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            时间: ${{ github.run_started_at }} UTC

            单文件免安装：exe 放到任意目录运行，配置/数据/日志都在 AppData\LocalLow\CloudPhoneKeep。
          files: |
            src-tauri/target/release/CloudPhoneKeep.exe
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # 冒烟档（push main / 手动触发）：真实引擎 + 真实 chrome-headless-shell
  # 端到端——本地动画页 + 保活注入 + 画面流出帧 + 控制链路 + 三旋钮热更新
  # + Basic Auth 全链路。
  # 浏览器经 install.sh 安装（版本单一源 cli/chrome-versions.env，与生产同版），
  # 冒烟跑的就是用户一键安装实际装到的 /opt 产物；ldd 运行库检查顺带在
  # runner 上回归「裸机最小依赖集可跑」。PR 不跑（省浏览器下载与时长，
  # 编译校验已由 linux job 覆盖）。
  # =====================================================================
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CPK_ENGINE: /opt/cloudphonekeep/cloudphonekeep
      CPK_SHELL: /opt/cloudphonekeep/chrome-headless-shell/chrome-headless-shell
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build engine (release, native)
        run: cargo build --release --manifest-path cli/Cargo.toml

      # 一键安装全链路实测：chrome-versions.env 单一源下载浏览器 → ldd
      # 运行库检查（runner 预装 Chrome 系依赖时零 apt；缺失则 root 自动补装
      # 最小集）→ 引擎 CPK_SELFTEST 自检 → /opt/cloudphonekeep 就位
      - name: Install via install.sh (engine = current build)
        run: sudo bash cli/install.sh --engine "$PWD/target/release/cloudphonekeep"

      - name: Smoke 1/3 — engine + chrome end-to-end
        run: bash cli/tests/ci_smoke.sh

      - name: Smoke 2/3 — knob hot-reload e2e
        run: python3 cli/tests/knob_e2e.py

      - name: Smoke 3/3 — basic auth e2e
        run: python3 cli/tests/auth_e2e.py

  # =====================================================================
  # CLI 版（cli/ + shared/，根 workspace）：Rust musl 静态引擎 + Alpine 交叉编译
  # + Debian Chromium + CDP；一容器一账号；全部编译在 CI 完成（本地无需 Rust）
  # 镜像多架构（linux/amd64 + linux/arm64）：Rust 交叉编译走 rust-lld
  # 原生速度，QEMU 仅用于 arm64 运行层的 apk 安装
  # （本 job 只管构建与发布产物；真浏览器端到端回归在上方 smoke 档）
  #
  # 另产出与镜像同源的 musl 静态二进制（amd64/arm64）发布到 dev Release：
  # 装了 chrome-headless-shell 的机器无需 Docker 可直接运行（裸机直跑）。
  # =====================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      # CLI 静态二进制（与 Docker 镜像内引擎同源同构）：runner 原生交叉编译，
      # 纯 Rust + musl 自包含 libc，rust-lld 链接无需目标架构 gcc；
      # PR 也执行（相当于 cli 的编译校验，失败快速拦截）
      - name: Build static CLI binaries (musl, amd64 + arm64)
        run: |
          for T in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=rust-lld" cargo build --release --target "$T" --manifest-path cli/Cargo.toml
          done
          cp target/x86_64-unknown-linux-musl/release/cloudphonekeep cloudphonekeep-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/cloudphonekeep cloudphonekeep-linux-arm64
          strip cloudphonekeep-linux-amd64 cloudphonekeep-linux-arm64 || true
          chmod +x cloudphonekeep-linux-amd64 cloudphonekeep-linux-arm64
          test -s cloudphonekeep-linux-amd64 && test -s cloudphonekeep-linux-arm64
          file cloudphonekeep-linux-amd64 cloudphonekeep-linux-arm64

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 裸机直跑二进制入 dev Release（与 Windows exe 同一处发布）：
      # musl 静态自包含，机器上只需 chrome-headless-shell 及其运行库。
      # 不带 body：已存在的 dev Release 描述保持不变（Windows job 维护）
      - name: Upload CLI binaries to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          files: |
            cloudphonekeep-linux-amd64
            cloudphonekeep-linux-arm64
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 多阶段构建（context=仓库根，Dockerfile 引用 cli/ 与 shared/ + 根 workspace 清单）：
      # Rust 编译在容器内完成（cargo 缓存挂载走 GHA cache）
      # 多架构推送（amd64 + arm64 单一 manifest 列表）：
      # arm64 层与 amd64 共享 GHA 层缓存，Rust 交叉编译原生速度
      - name: Push multi-arch image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:latest
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PR 无推送权限：本地构建校验编译通过（不产出、不跑测试）
      - name: Build image (PR compile check)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cpk:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
