name: Release

# 正式版发布：推 v* tag 触发（冒烟/构建已在 main 的 CI 完成后才打 tag）。
# 产物与 dev Release 同名同构：
#   - CloudPhoneKeep.exe（Windows 便携版）
#   - cloudphonekeep-linux-amd64 / -arm64（musl 静态，裸机直跑/install.sh 用）
#   - ghcr.io/xaxka/cloudphonekeep:<tag> + :latest（多架构镜像）
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build portable exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # 正式版说明由本 job 维护（linux job 只追加文件，不改 body——与
      # dev Release 双 job 模式一致）
      - name: Upload exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            正式版 ${{ github.ref_name }}（commit ${{ github.sha }}）

            双形态同源发布：

            - **Windows 便携版**：`CloudPhoneKeep.exe` 单文件免安装，
              配置/数据/日志在 `AppData\LocalLow\CloudPhoneKeep`
            - **CLI 版（Linux）**：`cloudphonekeep-linux-amd64` /
              `cloudphonekeep-linux-arm64`（musl 静态二进制，装了
              chrome-headless-shell 的机器直接跑；一键安装
              `curl -fsSL https://raw.githubusercontent.com/xaxka/CloudPhoneKeep/main/cli/install.sh | bash`）
            - **Docker 镜像**：`ghcr.io/xaxka/cloudphonekeep:${{ github.ref_name }}`
              与 `:latest`（amd64 + arm64 多架构）

            用法见仓库 README；本 tag 对应提交已通过 main 分支 CI
            （含真浏览器端到端冒烟档）。
          files: |
            src-tauri/target/release/CloudPhoneKeep.exe
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build static CLI binaries (musl, amd64 + arm64)
        run: |
          for T in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=rust-lld" cargo build --release --target "$T" --manifest-path cli/Cargo.toml
          done
          cp target/x86_64-unknown-linux-musl/release/cloudphonekeep cloudphonekeep-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/cloudphonekeep cloudphonekeep-linux-arm64
          strip cloudphonekeep-linux-amd64 cloudphonekeep-linux-arm64 || true
          chmod +x cloudphonekeep-linux-amd64 cloudphonekeep-linux-arm64
          test -s cloudphonekeep-linux-amd64 && test -s cloudphonekeep-linux-arm64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 镜像双标签：版本 tag + latest（与 dev 流程同一 Dockerfile）
      - name: Push multi-arch image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cloudphonekeep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload CLI binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cloudphonekeep-linux-amd64
            cloudphonekeep-linux-arm64
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
