[package]
name = "cloudphonekeep"
version = "1.12.2"
description = "云手机网页版多开保活工具（移动/联通，多 exe 多实例）"
authors = ["xixka"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# 独立工作区（不加入根 Cargo workspace）：保持自身 target/ 目录与 CI 产物路径
# （src-tauri/target/release/CloudPhoneKeep.exe）不变。共享库经 path 依赖引入，
# 在本工作区内编译。根 workspace 只管 cli/ + shared/。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloudphonekeep-shared = { path = "../shared" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt"] }

# Win32 虚拟桌面绑定（vdesk.rs）：与 tauri 2.x 自带的 windows 0.62 同源，
# 只取 COM/Shell/DWM/窗口四类最小特性
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
