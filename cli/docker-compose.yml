# =====================================================================
# CloudPhoneKeep CLI — 一个容器 = 一个账号
# ---------------------------------------------------------------------
# 用法（在本目录）：
#   mkdir -p data/138xxxx1234
#   docker compose up -d --build        # 构建即编译（容器内完成，无需本地 Rust）
#   # 打开控制页完成首次登录： http://127.0.0.1:8088/
#
# 多账号：把下方服务块复制一份，改 服务名/CPK_ACCOUNT/
#         data 目录/端口映射 —— 每个账号独立容器、独立 Profile、独立恢复。
#         平台三态：CPK_PLATFORM 环境变量直接指定（mobile/unicom，启动即加载，
#         免开控制页选择）；留空则控制页「设置→平台」选择后加载。
#
# 不想本地构建：注释掉 build:，直接用 GHCR 镜像
#   image: ghcr.io/xaxka/cloudphonekeep:latest
#   （多架构：amd64 / arm64 主机原生运行，无需 --platform）
#
# 不想用 Docker：CI 同源发布 musl 静态二进制（cloudphonekeep-linux-amd64），
#   装了 chrome-headless-shell 的机器可直接跑，见 cli/README.md「裸机直跑」。
# =====================================================================
services:

  # —— 示例账号：启动后平台留空，控制页「设置→平台」里选（移动云手机 / 联通云手机）——
  cpk-138xxxx1234:
    image: ghcr.io/xaxka/cloudphonekeep:latest
    build:
      context: ..                # 构建上下文在仓库根（Dockerfile 引用 cli/ 与 shared/）
      dockerfile: cli/Dockerfile
    container_name: cpk-138xxxx1234
    restart: unless-stopped
    init: true                      # 信号转发 + 僵尸回收（docker stop 优雅退出）
    shm_size: 128m                  # Chromium 渲染需要（默认 64MB 偏小）
    # mem_limit: 1g                 # 可选：单账号内存上限（Rust 引擎 ~10MB，主体是 Chromium，一般 400-600MB 足够）
    # oom_score_adj: 500            # 可选：内存吃紧时优先牺牲本容器而不是宿主关键服务
    environment:
      CPK_ACCOUNT: "138xxxx1234"    # 账号标识（决定 Profile 目录名，建议手机号）
      CPK_PLATFORM: "mobile"        # 启动平台（mobile=移动 / unicom=联通）；删除此行则留空，控制页「设置→平台」选择后加载
      TZ: Asia/Shanghai
      # —— 可选调优（默认即可）——
      # CPK_URL: "https://cloudphoneh5.buy.139.com"   # 覆盖平台默认入口
      # CPK_INTERVAL_MS: "5000"     # actionTick 周期（默认 5000ms）
      # CPK_EXTRA_CHROME_ARGS: "--js-flags=--max-old-space-size=512"  # 低内存调优
      # CPK_CONTROL_TOKEN: "换成长随机串"   # 控制页/截图/触摸的访问令牌
      # —— Basic Auth（公网可达时建议启用：控制页弹登录框，画面流/控制端点全保护）——
      # CPK_AUTH_USER: "admin"
      # CPK_AUTH_PASS: "换成长随机串"
    volumes:
      - ./data/138xxxx1234:/data    # Chromium Profile + 日志（Cookie/LocalStorage 持久化）
    ports:
      - "127.0.0.1:8088:8088"       # 控制页（首次登录/观察）；默认只绑本机回环
    healthcheck:
      disable: false                # 镜像内置 healthcheck；如需自定义在此覆盖

  # —— 多开：复制此块并改名，端口 8089 起；平台各自在控制页选择（留空待选）——
  # cpk-186xxxx5678:
  #   image: ghcr.io/xaxka/cloudphonekeep:latest
  #   build:
  #     context: ..
  #     dockerfile: cli/Dockerfile
  #   container_name: cpk-186xxxx5678
  #   restart: unless-stopped
  #   init: true
  #   shm_size: 128m
  #   environment:
  #     CPK_ACCOUNT: "186xxxx5678"
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - ./data/186xxxx5678:/data
  #   ports:
  #     - "127.0.0.1:8089:8088"
