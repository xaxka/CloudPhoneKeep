[package]
name = "cloudphonekeep-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "云手机网页版保活 CLI 版（Chromium Headless Shell + CDP，一实例一账号，Rust 低内存引擎；Docker 镜像与裸机直跑同源）"
authors = ["xixka"]
license = "MIT"

[[bin]]
name = "cloudphonekeep"
path = "src/main.rs"

[dependencies]
cloudphonekeep-shared = { path = "../shared" }
serde_json = "1"

# release 优化收口在根 workspace Cargo.toml（profile 成员内定义会被忽略）
